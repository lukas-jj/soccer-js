<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#121c20"><meta name="description" content="Pick your player. Play five-a-side football."><title>SOCCER / FIVE</title><link rel="stylesheet" href="../build/rogue.css"><script defer src="../build/rogue.bundle.js"></script></head><body>
<main id="game" aria-label="Five-a-side football">
<canvas id="pitch" tabindex="0" aria-label="Football pitch. WASD to move, J to pass or tackle, K or Space to shoot, L to lob or slide, Shift to sprint, E to call for a pass, Escape to pause."></canvas>
<div id="hud" hidden></div>
<div id="touch" hidden><div id="joystick" aria-label="Movement joystick"><span id="stick-nub"></span></div><div class="touch-actions"><button data-key="ShiftLeft" class="touch-sprint" aria-label="Hold to sprint">SPRINT</button><button data-key="KeyE" class="touch-call" aria-label="Call for a pass">CALL</button><button data-key="Digit2" class="touch-lob" aria-label="Lob with ball, slide tackle without ball">LOB</button><button data-key="Digit1" class="touch-pass" aria-label="Pass with ball, tackle without ball">PASS</button><button data-key="Digit3" class="touch-shoot" aria-label="Shoot with ball, body tackle without ball">SHOOT</button></div></div>
<section id="overlay" aria-label="Choose your player"></section>
<p id="message" role="status" aria-live="polite"></p>
</main>
</body></html>
