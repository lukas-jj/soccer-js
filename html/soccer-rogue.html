<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#121c20"><meta name="description" content="Start solo, recruit teammates at the tavern, or test any matchup up to five-a-side."><title>Spellside Cup</title><link rel="stylesheet" href="../build/rogue.css?v=spellside-tavern-entry"><script defer src="../build/rogue.bundle.js?v=spellside-dusk-hounds"></script></head><body>
<main id="game" aria-label="Spellside Cup fantasy football">
<canvas id="pitch" tabindex="0" aria-label="Football pitch. WASD to move, J to pass or tackle, K to shoot, L to lob, Shift to sprint, Tab to switch defenders, G for goalkeeper, Space to use your power, Escape to pause."></canvas>
<div id="hud" hidden></div>
<div id="touch" hidden><div id="joystick" aria-label="Movement joystick"><span id="stick-nub"></span></div><div class="touch-actions"><button data-key="ShiftLeft" class="touch-sprint" aria-label="Hold to sprint">SPRINT</button><button data-key="Space" class="touch-call" aria-label="Use player power">POWER</button><button data-key="KeyG" id="touch-keeper" class="touch-keeper" aria-label="Switch goalkeeper">KEEPER</button><button data-key="Tab" class="touch-switch" aria-label="Switch defender">SWITCH</button><button data-key="Digit2" class="touch-lob" aria-label="Lob">LOB</button><button data-key="Digit1" class="touch-pass" aria-label="Pass with ball, tackle without ball">PASS</button><button data-key="Digit3" class="touch-shoot" aria-label="Shoot with ball, body tackle without ball">SHOOT</button></div></div>
<section id="overlay" aria-label="Cup menu"></section>
<p id="message" role="status" aria-live="polite"></p>
</main>
</body></html>
